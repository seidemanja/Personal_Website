      .sp-mobile-copy {

          min-height: 0;

          line-height: 1.2;

        .sp-description {
          max-width: 100%;

          color: #444440;
          font-size: 0.855rem;
          line-height: 1.55;
          overflow-wrap: anywhere;

          display: none;
        }

        .sp-mobile-copy {
          display: inline;

          margin: 0;

          border-radius: 4px;
          background: transparent;
          font-size: 0.76rem;
          line-height: 1.15;
          white-space: nowrap;

      @media (hover: none) and (pointer: coarse) and (max-width: 420px) {
        .sp-content {

      .pd-nav {
        width: 100%;
        height: 47px;
        min-height: 47px;
        max-height: 47px;
        border-bottom: 0;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 7px 18px rgba(0, 0, 0, 0.055);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      .pd-nav-sticky {
        position: sticky;
        top: 0;
        z-index: 20;
        transform: translateZ(0);
      }

      .pd-nav-inner {
        box-sizing: border-box;
        width: 100%;
        max-width: 1920px;
        min-height: 47px;
        max-height: 47px;
        height: 47px;
        margin: 0 auto;
        padding: 0 clamp(8px, 3.9vw, 56px) 9px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: clamp(6px, 1.7vw, 22px);
      }

      .pd-nav-right-group {
        flex: 0 0 auto;
        display: flex;
        align-items: flex-end;
        gap: clamp(8px, 2.1vw, 27px);
      }

      .pd-nav-link {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: -9px;
        padding-bottom: 9px;
        color: #1d1d1d;
        font-size: 0.94rem;
        font-weight: 500;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
      }

      .pd-nav-brand {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: -9px;
        padding-bottom: 9px;
        color: #1d1d1d;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: 0.99rem;
        font-weight: 400;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
      }

      .pd-nav-desktop-brand-text {
        display: inline;
      }

      .pd-nav-mobile-brand-text {
        display: none;
      }

      .pd-nav-link::after {
        width: 100%;
        height: 2px;
        position: absolute;
        right: 0;
        bottom: 2px;
        left: 0;
        border-radius: 999px;
        background: #9d9d9a;
        content: "";
        opacity: 0;
      }

      .pd-nav-active {
        color: #1a1a1a;
      }

      .pd-nav-active::after {
        height: 2.6px;
        opacity: 1;
        background: #1d1d1d;
      }

      @media (max-width: 520px) {

          display: none;

        .pd-nav-mobile-brand-text {
          display: inline;

        .pd-nav-right-group {
          gap: clamp(13px, 4.2vw, 20px);
        }

      @media (orientation: landscape) and (max-height: 520px) and (max-width: 900px) {

      .pd-page {

      .pd-metrics {
        width: min(100%, 680px);
        margin-top: 28px;
        margin-right: auto;
        margin-left: auto;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;

      .pd-metric-card {

      .pd-architecture-diagram {
        --architecture-height: 500px;
        --architecture-connector-height: 484px;
        width: 100%;
        min-height: var(--architecture-height);
        position: relative;
        padding: 10px 0 0;
        margin: 0;
        overflow: visible;
      }

      .pd-twitter-architecture-diagram {

      }
      window.scrollTo(0, 0);

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const projectDetailPaths = new Set([
          '/ai-chat',
          '/resume',
          '/projects',
          '/projects/instagram-automation',
          '/projects/neuroscience-research',
          '/projects/personal-website-ai-assistant',
          '/projects/twitter-automation',
        ]);
        const path = window.location.pathname.replace(/\/+$/, '') || '/';

        if (!projectDetailPaths.has(path)) {
          return;
        }

        try {
          const snapshot = JSON.parse(
            sessionStorage.getItem(`project-detail-snapshot:${path}`) || 'null',
          );
          const root = document.getElementById('root');

          if (
            root
            && snapshot?.version === 'project-detail-refresh-v6'
            && typeof snapshot.html === 'string'
          ) {
            root.innerHTML = snapshot.html;
            root.dataset.restoredProjectSnapshot = 'true';
            root
              .querySelector('[data-ai-chat-messages="true"]')
              ?.scrollTo?.({
                top: root.querySelector('[data-ai-chat-messages="true"]').scrollHeight,
                left: 0,
                behavior: 'auto',
              });
          }
        } catch {
          sessionStorage.removeItem(`project-detail-snapshot:${path}`);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
