  <body>
    <div id="root"></div>
    <script>
      (() => {
        const projectDetailPaths = new Set([
          '/ai-chat',
          '/resume',
          '/projects',
          '/projects/instagram-automation',
          '/projects/neuroscience-research',
          '/projects/personal-website-ai-assistant',
          '/projects/product-management-data-ai',
          '/projects/twitter-automation',
        ]);
        const path = window.location.pathname.replace(/\/+$/, '') || '/';

        if (!projectDetailPaths.has(path)) {
          return;
        }

        try {
          const snapshot = JSON.parse(
            sessionStorage.getItem(`project-detail-snapshot:${path}`) || 'null',
          );
          const root = document.getElementById('root');

          if (
            root
            && snapshot?.version === 'project-detail-refresh-v26'
            && typeof snapshot.html === 'string'
          ) {
            root.innerHTML = snapshot.html;
            root.dataset.restoredProjectSnapshot = 'true';
            root
              .querySelector('[data-ai-chat-messages="true"]')
              ?.scrollTo?.({
                top: root.querySelector('[data-ai-chat-messages="true"]').scrollHeight,
                left: 0,
                behavior: 'auto',
              });
          }
        } catch {
          sessionStorage.removeItem(`project-detail-snapshot:${path}`);
        }
      })();
    </script>
