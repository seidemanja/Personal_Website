  <rect x="488" y="552" width="56" height="10" rx="5" fill="#dbdfe4"/>
  <rect x="584" y="552" width="60" height="10" rx="5" fill="#dbdfe4"/>
  <line x1="276" y1="580" x2="684" y2="580" stroke="#e8ebee" stroke-width="2"/>

